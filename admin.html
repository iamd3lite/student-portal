<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin &middot; Validation | FU ePortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin">
  <header class="admin-topbar">
    <a class="admin-brand" href="admin.html"><img src="school-logo.png" width="40" height="40" alt=""><span><span class="admin-brand-name">ePortal Admin</span><span class="admin-brand-sub">Course Reg Validation</span></span></a>
    <div class="admin-user">
      <div class="admin-user-meta"><strong data-admin-name>Administrator</strong><span data-admin-id>&mdash;</span></div>
      <a class="signout admin-signout" href="admin-login.html">Sign out</a>
    </div>
  </header>

  <main class="admin-main">
    <header class="page-head">
      <div><p class="eyebrow">Validation queue</p><h1>Submitted Course Forms</h1><p>Review course registration forms sent by students and approve or reject them.</p></div>
      <span class="session-badge">2025/2026 Session</span>
    </header>

    <div class="stat-grid admin-stats">
      <article class="stat-card"><span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span><div><strong class="stat-number" data-admin-total>0</strong><p class="stat-label">Total forms</p></div></article>
      <article class="stat-card"><span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><strong class="stat-number" data-admin-pending>0</strong><p class="stat-label">Pending</p></div></article>
      <article class="stat-card"><span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><div><strong class="stat-number" data-admin-approved>0</strong><p class="stat-label">Approved</p></div></article>
      <article class="stat-card"><span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span><div><strong class="stat-number" data-admin-rejected>0</strong><p class="stat-label">Rejected</p></div></article>
    </div>

    <div data-admin-list></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
